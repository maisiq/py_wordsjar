name: backend smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordsjar
          POSTGRES_PASSWORD: wordsjar
          POSTGRES_DB: wordsjar_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordsjar -d wordsjar_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # A dedicated, disposable database: the suite runs alembic migrations
      # and writes test data into it (see backend/tests/README.md).
      WORDSJAR_TEST_DB_DSN: postgresql+psycopg://wordsjar:wordsjar@localhost:5432/wordsjar_smoke

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run smoke tests
        run: uv run pytest -v
