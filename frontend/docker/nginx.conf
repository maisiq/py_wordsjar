# Раздача SPA и проксирование API.
#
# Статика и API живут на одном origin, поэтому CORS в схеме не участвует,
# а относительный /api/v1 работает и в dev (через Vite), и в проде (через nginx).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # brotli в официальном образе нет, gzip для SPA даёт основной выигрыш
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # SPA-fallback: прямой заход на /jar, /tests и любой неизвестный путь отдаёт
    # index.html, дальше маршрутизирует react-router (там же 404-страница).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # У файлов в /assets имена содержат хэш содержимого — кэшируем навсегда.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html ссылается на хэшированные ассеты: его кэшировать нельзя,
    # иначе после деплоя браузер будет искать файлы прошлой сборки.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /favicon.ico {
        expires 1d;
        access_log off;
    }

    # Проверка живости контейнера, используется в HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Бэкенд работает в network_mode: host (см. docker-compose.yml), поэтому
    # обращаемся к нему через хост. Если он переедет в сеть compose —
    # заменить адрес на http://backend:8080.
    location /api/v1/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}