# Заголовки безопасности.
#
# Подключается и в server, и в каждый location, который объявляет собственные
# add_header: nginx не наследует add_header из server, если location задаёт
# хотя бы один свой.
#
# CSP повторяет политику из vite.config.js (её видно в собранном index.html):
# внешних источников у приложения нет — шрифты в бандле, API на том же origin.
# 'unsafe-inline' в style-src нужен инлайн-стилям react-bootstrap/react-hot-toast.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS добавляется на терминаторе TLS (там, где сертификат), здесь его нет.